[project]
name = "fairaudit"
version = "0.1.0"
description = "Group-fairness audit toolkit and service, with a reproducible ChestX-ray14 metadata case study."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zeineb Jemli" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "jinja2>=3.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Training stack for the ChestX-ray14 case study (not needed to audit or to serve).
study = ["scikit-learn>=1.5"]
# HTTP service + web UI.
api = ["fastapi>=0.115", "python-multipart>=0.0.9", "uvicorn>=0.30"]

[project.scripts]
fairaudit = "fairaudit.cli:app"

[dependency-groups]
dev = [
    "fairaudit[api,study]",
    "fairlearn>=0.11",
    "httpx>=0.27",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fairaudit"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# The original university notebook is kept verbatim.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "C4",           # comprehensions
    "N",            # naming
    "PT",           # pytest style
    "PTH",          # pathlib
    "RUF",          # ruff-specific
    "LOG", "G",     # logging hygiene
]
ignore = ["N803", "N806"]  # allow ML-style names such as X_train

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:fairaudit.*",
    # Starlette's TestClient nudges towards another HTTP client; httpx is still supported.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["fairaudit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
